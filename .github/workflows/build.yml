name: Viso Android CI

on:
  push:
    branches:
      - m1-skeleton
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    name: Generate and commit Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      wrapper_commit: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: m1-skeleton

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        run: gradle :wrapper --gradle-version 8.11.1

      - name: Commit and push Wrapper files
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          if git diff --cached --quiet; then
            echo "Wrapper files already committed."
          else
            git commit -m "M1: add Gradle wrapper 8.11.1"
            git push origin HEAD:m1-skeleton
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  assemble-debug:
    name: Assemble debug APK
    needs: generate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository at Wrapper commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate-wrapper.outputs.wrapper_commit }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Viso-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Viso-build-diagnostics
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
